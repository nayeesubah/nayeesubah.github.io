name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-check is informational for now (pre-existing strict-TS errors in
      # inline scripts). `astro build` still validates all content collections.
      - run: npm run check
        continue-on-error: true
      - run: npm run build
        env:
          # Vault passwords for the members area. Set these as repository secrets
          # (Settings > Secrets and variables > Actions). Without them the
          # members matrix/portals build but cannot be unlocked. See CLAUDE.md.
          MATRIX_PASSWORD: ${{ secrets.MATRIX_PASSWORD }}
          MEMBER_PASSWORDS: ${{ secrets.MEMBER_PASSWORDS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

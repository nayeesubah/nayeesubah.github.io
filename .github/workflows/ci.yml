name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Informational until the pre-existing strict-TS errors are cleared.
      - run: npm run check
        continue-on-error: true
      # The real gate: build fails if any content collection violates its schema.
      - run: npm run build
